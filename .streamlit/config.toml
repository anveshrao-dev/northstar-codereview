[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = "none"

[theme]
base = "light"
greenColor = "#15803D"
greenTextColor = "#166534"
greenBackgroundColor = "#F0FDF4"
yellowColor = "#B45309"
yellowTextColor = "#92400E"
yellowBackgroundColor = "#FFFBEB"
redColor = "#B91C1C"
redTextColor = "#991B1B"
redBackgroundColor = "#FEF2F2"
blueColor = "#1D4ED8"
blueTextColor = "#1E40AF"
blueBackgroundColor = "#EFF6FF"
orangeColor = "#B45309"
orangeTextColor = "#9A3412"
orangeBackgroundColor = "#FFF7ED"
violetColor = "#6D28D9"
violetTextColor = "#5B21B6"
violetBackgroundColor = "#F5F3FF"
grayColor = "#64748B"
grayTextColor = "#334155"
grayBackgroundColor = "#F1F5F9"
primaryColor = "#0F766E"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
codeTextColor = "#0F172A"
codeBackgroundColor = "#FFFFFF"
codeFontSize = "0.875rem"
linkColor = "#0F766E"
linkUnderline = true
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.65rem", "1.25rem"]
headingFontWeights = [700, 650, 600]
metricValueFontSize = "1.75rem"
# Darker than decorative panel borders so native form boundaries exceed 3:1.
borderColor = "#64748B"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#0F172A"
headingFontSizes = ["1.75rem", "1.5rem", "1.25rem"]
