[project]
name = "northstar-codereview"
version = "0.1.0"
description = "Typed foundations for evidence-backed code review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "streamlit>=1.66.1,<2",
    "httpx>=0.28.1,<0.29",
    "openai>=3.42.0,<4",
    "langsmith>=0.14.16,<0.15",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".cache/uv"
python-downloads = "never"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers --basetemp=.cache/pytest-tmp"
cache_dir = ".cache/pytest"
filterwarnings = ["error"]
